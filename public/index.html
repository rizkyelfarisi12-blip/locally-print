<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalPrint</title>
        <style>
            :root {
                --p: #4f46e5;
                --b: #e5e7eb;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font:
                    14px system-ui,
                    sans-serif;
                background: #f6f7fb;
                color: #1e1b4b;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 24px;
                background: #fff;
                border-bottom: 1px solid var(--b);
            }
            h1 {
                font-size: 18px;
                margin: 0;
                color: var(--p);
            }
            .pill {
                padding: 3px 10px;
                border-radius: 99px;
                background: #dcfce7;
                color: #166534;
                font-size: 12px;
            }
            main {
                display: grid;
                grid-template-columns: 96px 1fr 330px;
                gap: 14px;
                padding: 14px;
                max-width: 1400px;
                margin: auto;
            }
            
            
            @media (max-width: 1000px) {
                main {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr);
                    gap: 8px;
                    padding: 8px;
                }

                /* Biarkan isi kolom utama mengikuti urutan grid */
                main > div:not(#thumbs):not(.card) {
                    display: contents;
                }

                /* Urutan elemen pada HP */
                #thumbs {
                    order: 1;
                    display: flex;
                    gap: 8px;
                    overflow-x: auto;
                    overflow-y: hidden;
                    max-height: none !important;
                    min-width: 0;
                    padding: 8px;
                    margin: 0;
                }

                main > div:not(#thumbs):not(.card) > .card:nth-child(1) {
                    order: 2;
                }

                main > div:not(#thumbs):not(.card) > .card:nth-child(2) {
                    order: 3;
                }

                main > .card {
                    order: 4;
                }

                main > div:not(#thumbs):not(.card) > .card:nth-child(3) {
                    order: 5;
                }

                /* Kartu lebih ringkas */
                .card {
                    min-width: 0;
                    padding: 10px;
                    border-radius: 12px;
                    margin-bottom: 0;
                }

                header {
                    padding: 10px 12px;
                }

                h1 {
                    font-size: 17px;
                }

                #drop {
                    padding: 16px 10px;
                    font-size: 13px;
                }

                /* Preview tidak terlalu besar di layar HP */
                #stage {
                    height: 45vh;
                    min-height: 240px;
                    max-height: 380px;
                    padding: 8px;
                }

                .tb {
                    gap: 5px;
                }

                .tb button {
                    padding: 5px 7px;
                    font-size: 11px;
                }

                /* Pengaturan tetap mudah disentuh */
                label {
                    margin: 7px 0 3px;
                }

                select,
                input[type="text"],
                input[type="number"],
                input:not([type]),
                input[type="password"] {
                    font-size: 14px;
                    padding: 7px;
                }

                /* Riwayat bisa digeser horizontal jika tabel lebar */
                #jt {
                    display: block;
                    overflow-x: auto;
                    max-width: 100%;
                }
            }


            .card {
                background: #fff;
                border: 1px solid var(--b);
                border-radius: 14px;
                padding: 14px;
                box-shadow: 0 1px 3px #0001;
                margin-bottom: 14px;
            }
            #drop {
                border: 2px dashed #a5b4fc;
                border-radius: 14px;
                padding: 22px;
                text-align: center;
                cursor: pointer;
                transition: 0.2s;
            }
            #drop.over {
                background: #eef2ff;
            }
            #thumbs {
                max-height: 78vh;
                overflow: auto;
                padding: 8px;
            }
            .th {
                position: relative;
                margin-bottom: 8px;
                border: 2px solid transparent;
                border-radius: 6px;
                cursor: pointer;
                text-align: center;
                flex: none;
            }
            .th canvas {
                width: 72px;
                display: block;
                margin: auto;
                background: #fff;
                box-shadow: 0 1px 3px #0003;
            }
            .th.cur {
                border-color: var(--p);
            }
            .th.out {
                opacity: 0.35;
            }
            .th small {
                font-size: 10px;
            }
            .tb {
                display: flex;
                gap: 6px;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }
            .tb button {
                padding: 5px 9px;
            }
            #stage {
                background: #e5e7eb;
                border-radius: 10px;
                height: 68vh;
                overflow: auto;
                padding: 16px;
                position: relative;
            }
            #sheet {
                background: #fff;
                margin: auto;
                box-shadow: 0 4px 18px #0003;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    width 0.15s,
                    height 0.15s;
                overflow: hidden;
            }
            #spin {
                position: absolute;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                background: #fff8;
                font-weight: 600;
            }
            label {
                display: block;
                margin: 9px 0 3px;
                font-weight: 600;
                font-size: 12px;
            }
            select,
            input[type="text"],
            input[type="number"],
            input:not([type]),
            input[type="password"] {
                width: 100%;
                padding: 7px;
                border: 1px solid #d1d5db;
                border-radius: 8px;
            }
            button {
                background: var(--p);
                color: #fff;
                border: 0;
                border-radius: 9px;
                padding: 10px 14px;
                font-weight: 600;
                cursor: pointer;
            }
            button:disabled {
                opacity: 0.5;
            }
            button.s {
                background: #e0e7ff;
                color: #3730a3;
                padding: 3px 8px;
                font-size: 12px;
            }
            #msg {
                margin-top: 8px;
                font-size: 13px;
            }
            .err {
                color: #b91c1c;
            }
            .ok {
                color: #166534;
            }
            td {
                padding: 4px 6px;
                border-top: 1px solid #eee;
                font-size: 12px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            .cb {
                display: flex;
                gap: 6px;
                align-items: center;
                font-weight: 400;
            }
            .cb input {
                width: auto;
            }
            summary {
                cursor: pointer;
                font-weight: 600;
                margin-top: 10px;
            }
            #sum {
                font-size: 12px;
                background: #f9fafb;
                border-radius: 8px;
                padding: 8px;
                margin-top: 8px;
                line-height: 1.6;
            }
        </style></head><body>
        <header><h1>🖨 LocalPrint</h1><div><span class="pill">Online</span> <input id="pin" type="password" placeholder="PIN" style="width:80px;display:none"></div></header>
        <main>
            <div id="thumbs" class="card"></div>
            <div>
                <div class="card"><div id="drop">Seret file ke sini atau klik untuk Browse Files<br><small>PDF, DOC/DOCX, JPG, PNG, TXT</small><input id="f" type="file" hidden accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.txt"></div><div id="fi" style="margin-top:8px"></div></div>
                <div class="card"><div class="tb">
                        <button class="s" onclick="go(-1)">◀</button><span><input id="pn" type="number" min="1" style="width:56px;padding:3px" onchange="goto(+this.value)"> / <b id="pt">0</b></span><button class="s" onclick="go(1)">▶</button>
                        <button class="s" onclick="zm(1/1.25)">−</button><button class="s" onclick="zm(1.25)">+</button><button class="s" onclick="fit('page')">Fit page</button><button class="s" onclick="fit('width')">Fit width</button><span id="zl" style="font-size:12px"></span></div>
                    <div id="stage"><div id="sheet"><canvas id="cv"></canvas></div><div id="spin">Memproses preview…</div></div></div>
                <div class="card"><b>Riwayat</b> <button class="s" onclick="jobs()">Refresh</button> <a href="/admin.html" style="font-size:12px">Admin</a><table id="jt"></table></div>
            </div>
            <div class="card" style="height:fit-content"><b>Pengaturan Cetak</b>
                <label>Printer <button class="s" onclick="printers()">Refresh</button></label><select id="printer"></select>
                <label>Halaman</label><select id="ps"><option value="">Semua</option><option value="cur">Halaman ini</option><option value="odd">Ganjil saja</option><option value="even">Genap saja</option><option value="r">Rentang</option></select>
                <input id="range" placeholder="1-3, 5, 8-10" style="display:none;margin-top:6px">
                <label>Salinan</label><input id="copies" type="number" value="1" min="1">
                <label>Kertas</label><select id="paper"><option>A4</option><option>A3</option><option>A5</option><option>Letter</option><option>Legal</option></select>
                <label>Orientasi</label><select id="orientation"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select>
                <label>Warna</label><select id="color"><option value="color">Warna</option><option value="gray">Grayscale</option><option value="bw">Hitam-putih</option></select>
                <label>Sisi</label><select id="sides"><option value="one">Satu sisi</option><option value="long">Dua sisi (sisi panjang)</option><option value="short">Dua sisi (sisi pendek)</option></select>
                <label>Skala</label><select id="scaling"><option value="fit">Fit to page</option><option value="actual">Ukuran asli</option><option value="custom">Kustom</option></select><input id="scale" type="number" value="100" min="10" max="400" style="display:none;margin-top:6px" placeholder="%">
                <label>Margin</label><select id="margin"><option value="default">Default</option><option value="none">Tanpa margin (jika driver mengizinkan)</option></select>
                <label>Halaman per lembar</label><select id="nup"><option>1</option><option>2</option><option>4</option><option>6</option><option>9</option><option>16</option></select>
                <label class="cb"><input type="checkbox" id="reverse"> Urutan terbalik</label><label class="cb"><input type="checkbox" id="collate"> Collate</label>
                <details id="drvbox" style="display:none"><summary>Tray, kualitas &amp; finishing</summary><div id="drv"></div></details>
                <div id="capnote" style="font-size:11px;color:#6b7280;margin-top:6px"></div>
                <div id="sum"></div>
                <p><button id="go" style="width:100%" disabled onclick="pr()">Print Document</button></p><div id="msg"></div></div>
        </main>
        <script src="/vendor/pdfjs/pdf.min.js"></script>
        <script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SZ={A4:[210,297],A3:[297,420],A5:[148,210],Letter:[216,279],Legal:[216,356]};
let cur=null,caps=null,doc=null,pg=1,mode='page',z=1,task=null,gen=0;
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='/vendor/pdfjs/pdf.worker.min.js';
const H=()=>({'x-pin':$('pin').value,'Content-Type':'application/json'});
async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H(),...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
const msg=(t,c)=>{$('msg').className=c;$('msg').textContent=t};
// ---- printers & capabilities ----
async function printers(){try{const p=await api('/api/printers'),inf=await api('/api/info');$('printer').innerHTML=p.map(x=>`<option ${(inf.defaultPrinter?x.name===inf.defaultPrinter:x.default)?'selected':''} value="${esc(x.name)}">${esc(x.name)}${x.default?' (default)':''} — ${x.status}</option>`).join('')||'<option value="">Tidak ada printer terdeteksi</option>';loadCaps()}catch(e){msg(e.message,'err')}}
async function loadCaps(){const n=$('printer').value;if(!n)return;try{caps=await api('/api/caps/'+encodeURIComponent(n))}catch{caps=null}
 const o=$('sides').options,d=caps&&caps.detected;for(const x of o)x.disabled=d&&x.value!=='one'&&!caps.duplex;if(d&&!caps.duplex)$('sides').value='one';
 const box=$('drv');box.innerHTML='';const list=d?caps.driver:[];
 for(const x of list)box.insertAdjacentHTML('beforeend',`<label>${esc(x.label)}</label><select data-k="${esc(x.key)}"><option value="">(bawaan driver)</option>${x.values.map(v=>`<option ${v===x.def?'':''}>${esc(v)}</option>`).join('')}</select>`);
 $('drvbox').style.display=list.length?'block':'none';
 $('capnote').textContent=d?(caps.duplex?'Duplex didukung. ':'Duplex tidak didukung driver. ')+(list.length?'':'Tray/kualitas/finishing tidak dilaporkan driver.'):'Kemampuan printer tidak terdeteksi (Windows): hanya opsi dasar yang dikirim; tray/kualitas/stapling tidak tersedia.'; summary()}
// ---- queue ----
const ST={processing:'Diproses',submitted:'Terkirim ke spooler',completed:'Selesai (dikonfirmasi CUPS)',left_queue:'Keluar dari antrean (tidak terkonfirmasi)',failed:'Gagal',canceled:'Dibatalkan'};
async function jobs(){try{const j=await api('/api/jobs');$('jt').innerHTML=j.map(x=>`<tr><td>${esc(x.doc)}</td><td>${esc(x.printer)}</td><td>${new Date(x.time).toLocaleString()}</td><td>${ST[x.status]||x.status}${x.error?': '+esc(x.error):''}${x.options&&x.options.grayscaleConverted?' <small>(dikonversi grayscale)</small>':''}</td><td>${x.status==='submitted'&&x.spoolId?`<button class="s" onclick="cx('${x.id}')">Batal</button>`:''}</td></tr>`).join('')}catch{}}
async function cx(id){try{await api('/api/jobs/'+id+'/cancel',{method:'POST'})}catch(e){msg(e.message,'err')}jobs()}
setInterval(jobs,5000);
// ---- preview ----
function selected(n){const v=$('ps').value;if(v==='cur')return n===pg;if(v==='odd')return n%2===1;if(v==='even')return n%2===0;if(v==='r'){try{return $('range').value.split(',').some(p=>{const[a,b]=p.trim().split('-').map(Number);return b?n>=a&&n<=b:n===a})}catch{return true}}return true}
function dims(){const[w,h]=SZ[$('paper').value];return $('orientation').value==='landscape'?[h,w]:[w,h]}
async function render(){if(!doc)return;const my=++gen;$('spin').style.display='flex';
 const[w,h]=dims(),st=$('stage'),aw=st.clientWidth-32,ah=st.clientHeight-32;
 const base=mode==='width'?aw:Math.min(aw,ah*w/h),W=Math.max(120,base*z),Hh=W*h/w;
 const sh=$('sheet');sh.style.width=W+'px';sh.style.height=Hh+'px';$('zl').textContent=Math.round(W/(w*3.78)*100)+'%';
 const page=await doc.getPage(pg),v0=page.getViewport({scale:1}),sc=Math.min(W/v0.width,Hh/v0.height),dpr=devicePixelRatio||1,v=page.getViewport({scale:sc*dpr});
 if(task)try{task.cancel()}catch{}
 const c=$('cv');c.width=v.width;c.height=v.height;c.style.width=v.width/dpr+'px';c.style.height=v.height/dpr+'px';c.style.filter=$('color').value==='gray'?'grayscale(1)':$('color').value==='bw'?'grayscale(1) contrast(3)':'';
 task=page.render({canvasContext:c.getContext('2d'),viewport:v});try{await task.promise}catch{}
 if(my===gen)$('spin').style.display='none';$('pn').value=pg;
 document.querySelectorAll('.th').forEach(t=>t.classList.toggle('cur',+t.dataset.n===pg))}
const goto=n=>{if(doc&&n>=1&&n<=doc.numPages){pg=n;render();summary()}};const go=d=>goto(pg+d);
const zm=f=>{z=Math.min(4,Math.max(.3,z*f));render()},fit=m=>{mode=m;z=1;render()};
function markThumbs(){document.querySelectorAll('.th').forEach(t=>t.classList.toggle('out',!selected(+t.dataset.n)))}
async function thumbs(){const box=$('thumbs');box.innerHTML='';const io=new IntersectionObserver(es=>es.forEach(async e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const n=+e.target.dataset.n,p=await doc.getPage(n),v=p.getViewport({scale:1}),s=144/v.width,vp=p.getViewport({scale:s}),c=e.target.querySelector('canvas');c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}),{root:null});
 for(let n=1;n<=doc.numPages;n++){const d=document.createElement('div');d.className='th';d.dataset.n=n;d.innerHTML='<canvas width="72" height="100"></canvas><small>'+n+'</small>';d.onclick=()=>goto(n);box.appendChild(d);io.observe(d)}markThumbs()}
async function upl(file){const fd=new FormData();fd.append('file',file);$('fi').textContent='Mengunggah/memproses '+file.name+'…';
 try{const r=await fetch('/api/upload',{method:'POST',headers:{'x-pin':$('pin').value},body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error);cur=j;
 $('spin').style.display='flex';doc=await pdfjsLib.getDocument({url:'/api/file/'+j.id,httpHeaders:{'x-pin':$('pin').value}}).promise;cur.pages=doc.numPages;pg=1;$('pt').textContent=doc.numPages;$('pn').max=doc.numPages;
 $('fi').innerHTML=`${esc(j.name)} (${(j.size/1024).toFixed(0)} KB, ${doc.numPages} hal) <button class="s" onclick="clr()">Hapus</button>`;
 $('go').disabled=false;await render();thumbs();summary()}catch(e){$('spin').style.display='none';$('fi').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
function clr(){cur=null;doc=null;$('thumbs').innerHTML='';$('fi').textContent='';$('go').disabled=true;$('cv').width=1;$('pt').textContent=0}
// ---- summary & print ----
function opts(){const ps=$('ps').value,drv={};document.querySelectorAll('#drv select').forEach(s=>{if(s.value)drv[s.dataset.k]=s.value});
 return{pages:cur&&cur.pages,reverse:$('reverse').checked,collate:$('collate').checked,copies:+$('copies').value,paper:$('paper').value,orientation:$('orientation').value,color:$('color').value,scaling:$('scaling').value,scale:+$('scale').value,margin:$('margin').value,sides:$('sides').value,nup:+$('nup').value,
 pageSet:ps==='odd'||ps==='even'?ps:'',range:ps==='r'?$('range').value:ps==='cur'?String(pg):'',printer:$('printer').value,driverOpts:drv}}
function summary(){markThumbs();if(!cur){$('sum').textContent='';return}const o=opts();let n=0;for(let i=1;i<=cur.pages;i++)if(selected(i))n++;
 const sheets=Math.ceil(n/o.nup/(o.sides==='one'?1:2))*o.copies;
 $('sum').innerHTML=`<b>${esc(cur.name)}</b><br>${esc(o.printer)} · ${n} hal · ${o.copies} salinan<br>${o.paper} ${o.orientation} · ${{gray:'Grayscale',bw:'Hitam-putih',color:'Warna'}[o.color]} · ${o.sides==='one'?'1 sisi':'2 sisi'} · ${o.nup}/lembar<br>Estimasi: <b>${sheets}</b> lembar`}
async function pr(){const b={...opts(),fileId:cur.id,name:cur.name};$('go').disabled=true;
 try{await api('/api/print',{method:'POST',body:JSON.stringify(b)});msg('Terkirim ke antrean printer. Status selesai diperbarui otomatis di Riwayat bila dapat dikonfirmasi.','ok')}catch(e){msg(e.message,'err')}$('go').disabled=false;jobs()}
$('ps').onchange=()=>{$('range').style.display=$('ps').value==='r'?'block':'none';summary()};$('range').oninput=summary;
$('scaling').onchange=()=>{$('scale').style.display=$('scaling').value==='custom'?'block':'none';summary()};
for(const i of ['margin','scale','paper','orientation','color','sides','nup','copies'])$(i).onchange=()=>{render();summary()};
$('printer').onchange=loadCaps;
$('drop').onclick=()=>$('f').click();$('f').onchange=e=>e.target.files[0]&&upl(e.target.files[0]);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};$('drop').ondragleave=()=>$('drop').classList.remove('over');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');e.dataTransfer.files[0]&&upl(e.dataTransfer.files[0])};
addEventListener('resize',()=>render());
fetch('/api/info').then(r=>r.json()).then(i=>{document.title=i.appName;document.querySelector('h1').textContent='🖨 '+i.appName;if(i.pinRequired)$('pin').style.display='inline-block'});
$('pin').onchange=()=>{printers();jobs()};printers();jobs();
</script></body></html>
